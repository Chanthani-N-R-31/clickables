<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internship Coordinator Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f4f7fa;
        }


        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>

<body class="bg-[#f4f7fa] text-[#0a192f] antialiased flex h-screen overflow-hidden relative">

    <!-- Sidebar -->
    <aside class="hidden md:flex flex-col w-64 bg-white border-r border-slate-200 z-20">
        <div class="p-8 border-b border-slate-50">
            <div class="flex items-center gap-3 mb-6">
                <span class="text-[#005af5] text-3xl">⚡</span>
                <div class="font-black text-xl tracking-tighter text-[#1e293b] leading-tight uppercase">Sports Science<br>Engineer</div>
            </div>
            <p class="text-[0.65rem] text-slate-400 uppercase font-black tracking-widest">
                Logged in as: <span class="text-amber-500 font-bold">Coordinator</span>
            </p>
        </div>
        <nav class="flex-1 px-4 space-y-1">
            <div class="my-4 border-t border-slate-100"></div>
            <a href="intern_co-or_mentor_managemrnt.html"
                class="w-full flex items-center px-4 py-3 text-sm font-medium text-slate-600 hover:bg-slate-50 rounded-xl transition-colors">
                <span class="mr-3">📋</span> All Interns
            </a>
            <a href="intern_co_ord_batch_link.html"
                class="w-full flex items-center px-4 py-3 text-sm font-medium text-slate-600 hover:bg-slate-50 rounded-xl transition-colors">
                <span class="mr-3">🔗</span> Batch Link
            </a>
            <a href="intern_co_ord_assessments.html"
                class="w-full flex items-center px-4 py-3 text-sm font-medium text-slate-600 hover:bg-slate-50 rounded-xl transition-colors">
                <span class="mr-3">📝</span> Assessments
            </a>
            <a href="intern_co_ord_feedback.html"
                class="w-full flex items-center px-4 py-3 text-sm font-bold text-amber-700 bg-amber-50 border border-amber-200 shadow-sm rounded-xl transition-colors">
                <span class="mr-3">💬</span> Feedback
            </a>
            <a href="intern_co_ord_manage_holidays.html"
                class="w-full flex items-center px-4 py-3 text-sm font-medium text-slate-600 hover:bg-slate-50 rounded-xl transition-colors">
                <span class="mr-3">📅</span> Manage Holidays
            </a>
            <a href="intern_co_ord_college.html"
                class="w-full flex items-center px-4 py-3 text-sm font-medium text-slate-600 hover:bg-slate-50 rounded-xl transition-colors">
                <span class="mr-3">🏫</span> College
            </a>
        </nav>
    </aside>

    <main class="flex-1 flex flex-col h-screen overflow-hidden relative">
        <header id="main-header"
            class="bg-white/40 backdrop-blur-sm z-10 relative p-6 flex justify-between items-center border-b border-slate-200/60">
            <div id="header-text-container">
                <h1 id="page-title" class="text-2xl font-black text-slate-800 tracking-tight">Intern Feedback</h1>
                <p id="page-subtitle" class="text-[0.65rem] font-bold text-slate-400 uppercase tracking-widest mt-1">
                    SUBMISSIONS FROM THE INTERNSHIP PROGRAM</p>
            </div>
            <div id="header-action-container">
                <span
                    class="bg-blue-50 text-blue-600 px-4 py-1.5 rounded-full text-[0.65rem] font-black uppercase border border-blue-100 shadow-sm">—
                    COORDINATOR</span>
            </div>
        </header>

        <div class="flex-1 overflow-auto p-6 space-y-6">

            <!-- VIEW: Feedback (Main List and Detail) -->
            <div id="view-feedback" class="max-w-6xl mx-auto space-y-6">

                <!-- Feedback List (Matches image_208e40.png) -->
                <div id="feedback-list-container" class="space-y-6">
                    <div class="relative group">
                        <input type="text" placeholder="Filter by name, email, form, or date..."
                            class="w-full pl-6 pr-12 py-4 bg-white border border-slate-200 rounded-2xl text-slate-700 text-sm shadow-sm focus:ring-4 focus:ring-blue-500/5 focus:border-blue-500 outline-none transition-all">
                        <span
                            class="absolute right-6 top-1/2 -translate-y-1/2 text-slate-300 pointer-events-none group-focus-within:text-blue-500 transition-colors">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"
                                    d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                            </svg>
                        </span>
                    </div>

                    <div class="bg-white border border-slate-200 shadow-sm rounded-2xl overflow-hidden">
                        <div class="overflow-x-auto">
                            <table class="w-full text-left text-sm whitespace-nowrap">
                                <thead
                                    class="bg-[#f8fafc] text-slate-400 font-bold border-b border-slate-100 uppercase text-[10px] tracking-widest">
                                    <tr>
                                        <th class="p-5">Intern</th>
                                        <th class="p-5">Form</th>
                                        <th class="p-5">Submitted</th>
                                        <th class="p-5 text-right">Action</th>
                                    </tr>
                                </thead>
                                <tbody id="feedback-table-body" class="divide-y divide-slate-50"></tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- Feedback Detail (Matches image_2091e6.png) -->
                <div id="feedback-detail-container" class="hidden space-y-6">
                    <button onclick="closeFeedbackDetail()"
                        class="flex items-center gap-2 text-slate-500 hover:text-slate-800 font-bold text-xs uppercase tracking-widest transition-colors">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"
                                d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                        </svg>
                        Back to submissions
                    </button>

                    <div id="feedback-detail-content"
                        class="bg-white border border-slate-200 shadow-sm rounded-3xl overflow-hidden">
                        <!-- Header and responses injected here -->
                    </div>
                </div>

            </div>

        </div>
    </main>

    <!-- Floating Navigation Buttons -->
    <div class="fixed bottom-6 right-6 flex items-center gap-3 z-[60]">
        <a href="INTERN-CO-ORDINATOR.drawio.html"
            class="w-12 h-12 flex items-center justify-center bg-white border border-slate-200 rounded-full shadow-lg hover:bg-slate-50 transition-all hover:scale-110 active:scale-95">
            <svg class="w-6 h-6 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
            </svg>
        </a>
        <a href="IT.drawio (1).html"
            class="w-12 h-12 flex items-center justify-center bg-[#005af5] rounded-full shadow-lg hover:bg-blue-600 transition-all hover:scale-110 active:scale-95 text-white">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
            </svg>
        </a>
    </div>

    <div id="toast-container" class="fixed bottom-6 right-6 z-50"></div>

    <script>
        // --- DATA ---
        let feedbackData = [
            {
                id: 1,
                intern: "test",
                email: "rahulas8431@gmail.com",
                form: "CSS Internship Feedback Form",
                submitted: "Mar 26, 2026 10:43 AM",
                responses: [
                    { q: "Which year are you in?", a: "M.P.T Student" },
                    { q: "CSS Internship Batch (Month and year)", a: "March - 2026" },
                    { q: "Was the orientation session clear and informative?", a: "Yes" },
                    { q: "How useful were the lectures and teaching sessions?", a: "Extremely useful" },
                    { q: "Did you have sufficient opportunities to observe and manage clients?", a: "Yes" }
                ]
            }
        ];

        // --- FEEDBACK LIST RENDER ---
        function renderFeedbackList() {
            document.getElementById('feedback-list-container').classList.remove('hidden');
            document.getElementById('feedback-detail-container').classList.add('hidden');

            const body = document.getElementById('feedback-table-body');
            body.innerHTML = feedbackData.map(f => `
                <tr class="hover:bg-slate-50/80 transition-colors">
                    <td class="p-5 font-black text-slate-800 text-[13px] tracking-tight">${f.intern}</td>
                    <td class="p-5 font-medium text-slate-500 text-xs">${f.form}</td>
                    <td class="p-5 font-medium text-slate-500 text-xs">${f.submitted}</td>
                    <td class="p-5 text-right">
                        <button onclick="viewFeedbackDetail(${f.id})" class="bg-[#0f172a] text-white px-5 py-1.5 rounded font-black text-[10px] tracking-widest hover:bg-slate-800 transition-colors uppercase">View</button>
                    </td>
                </tr>
            `).join('');
        }

        // --- FEEDBACK DETAIL RENDER (Matches image_2091e6.png) ---
        function viewFeedbackDetail(id) {
            const data = feedbackData.find(f => f.id === id);
            if (!data) return;

            document.getElementById('feedback-list-container').classList.add('hidden');
            const detailContainer = document.getElementById('feedback-detail-container');
            const content = document.getElementById('feedback-detail-content');

            detailContainer.classList.remove('hidden');

            content.innerHTML = `
                <!-- Meta Header -->
                <div class="p-8 border-b border-slate-100">
                    <h2 class="text-xl font-bold text-slate-900">${data.form}</h2>
                    <p class="text-sm text-blue-600 font-medium mt-1">${data.intern} - ${data.email}</p>
                    <p class="text-xs text-slate-400 mt-1">${data.submitted}</p>
                </div>
                
                <!-- Response List -->
                <div class="p-8 space-y-4 bg-slate-50/30">
                    ${data.responses.map(res => `
                        <div class="bg-white border border-slate-100 p-6 rounded-2xl shadow-sm">
                            <h4 class="text-sm font-bold text-slate-800 mb-2">${res.q}</h4>
                            <p class="text-sm text-slate-500 font-medium">${res.a}</p>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function closeFeedbackDetail() {
            renderFeedbackList();
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderFeedbackList();
        });
    </script>
</body>

</html>
