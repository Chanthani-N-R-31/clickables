<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0">
    <title>Athlete & Visitors Hub - IT Control | I Lit My Sport</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        ::-webkit-scrollbar {
            height: 4px;
            width: 4px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }

        * {
            -webkit-tap-highlight-color: transparent;
        }

        @keyframes slide-up {
            from {
                transform: translateY(20px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .animate-in {
            animation: slide-up 0.4s ease-out forwards;
        }

        .sidebar-transition {
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @media (max-width: 768px) {
            .sidebar-hidden {
                transform: translateX(-100%);
            }
            .sidebar-visible {
                transform: translateX(0);
            }
        }
    </style>
</head>

<body
    class="bg-gradient-to-br from-[#f4f8fb] via-[#edf3f8] to-[#e0eaf5] text-[#0a192f] antialiased flex h-screen overflow-hidden relative">

    <!-- Global Navigation -->
    <div class="fixed bottom-6 right-6 flex gap-4 z-[40]">
        <button onclick="window.history.back()" class="flex items-center justify-center w-12 h-12 bg-white/80 backdrop-blur-md border border-slate-200 rounded-full shadow-lg hover:bg-white transition-all active:scale-95 group">
            <i class="ph ph-arrow-left text-xl text-slate-600 group-hover:text-blue-600"></i>
        </button>
        <a href="IT.drawio (1).html" class="flex items-center justify-center w-12 h-12 bg-blue-600 border border-blue-500 rounded-full shadow-lg hover:bg-blue-700 transition-all active:scale-95 group">
            <i class="ph ph-house text-xl text-white"></i>
        </a>
    </div>

    <!-- Decorative Blurs -->
    <div
        class="fixed top-[-5%] left-[-5%] w-[50vw] h-[50vw] rounded-full bg-[#005af5] opacity-[0.06] blur-[100px] pointer-events-none z-0">
    </div>
    <div
        class="fixed bottom-[-10%] right-[-5%] w-[45vw] h-[45vw] rounded-full bg-purple-600 opacity-[0.05] blur-[120px] pointer-events-none z-0">
    </div>

    <!-- Sidebar Backdrop for Mobile -->
    <div id="sidebar-backdrop" onclick="toggleSidebar()" 
        class="fixed inset-0 bg-slate-900/40 backdrop-blur-[2px] z-[45] hidden md:hidden"></div>

    <!-- Sidebar -->
    <aside id="sidebar" 
        class="fixed md:relative w-64 h-full bg-white border-r border-slate-200 shadow-xl z-50 flex flex-col flex-shrink-0 sidebar-transition sidebar-hidden md:sidebar-visible">
        <div class="p-6 border-b border-slate-100 flex justify-between items-center">
            <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center text-white font-black">LS</div>
            <button onclick="toggleSidebar()" class="md:hidden text-slate-400 hover:text-slate-600 p-1">
                <i class="ph ph-x text-2xl font-bold"></i>
            </button>
        </div>
        <div class="p-6 flex-1 overflow-y-auto">
            <nav class="space-y-1">
                <div class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-4 px-3">Management</div>
                <a href="#"
                    class="flex items-center gap-3 px-3 py-2 text-sm font-bold text-slate-500 hover:text-blue-600 transition-colors">
                    Dashboard
                </a>
                <a href="#"
                    class="flex items-center gap-3 px-3 py-2 text-sm font-black text-blue-600 bg-blue-50/50 rounded-lg transition-colors border-l-4 border-blue-600">
                    Athletes & Visitors
                </a>
                <a href="#"
                    class="flex items-center gap-3 px-3 py-2 text-sm font-bold text-slate-500 hover:text-blue-600 transition-colors">
                    IT Support
                </a>
            </nav>
        </div>
    </aside>

    <main class="flex-1 flex flex-col overflow-hidden relative w-full">
        <header
            class="bg-transparent z-10 relative p-4 md:p-6 flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-slate-200/50 md:border-none">
            <div class="flex items-center">
                <button onclick="toggleSidebar()"
                    class="md:hidden mr-4 p-2 text-slate-600 bg-white shadow-sm rounded-xl border border-slate-100 active:scale-95 transition-transform">
                    <i class="ph ph-list text-2xl font-bold"></i>
                </button>
                <div>
                    <h1 class="text-xl md:text-2xl font-black text-[#0a192f] leading-none">Athlete & Visitor Hub</h1>
                    <p class="text-slate-500 text-[10px] md:text-xs mt-1 md:mt-2">Lifecycle distribution and registry access.</p>
                </div>
            </div>
            <div class="relative w-full md:w-auto">
                <i class="ph ph-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                <input type="text" id="saSearch" placeholder="Filter identities..."
                    class="w-full md:w-64 bg-white/80 border border-slate-200 rounded-xl py-2.5 pl-10 pr-5 text-sm font-semibold outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-200 transition-all shadow-sm">
            </div>
        </header>

        <div class="flex-1 overflow-y-auto p-4 md:p-8 pt-2 md:pt-6">
            <div
                class="bg-white/90 backdrop-blur-2xl border border-white/50 rounded-2xl md:rounded-3xl shadow-xl shadow-slate-200/50 overflow-hidden animate-in">
                <div class="overflow-x-auto overflow-y-hidden">
                    <table class="w-full text-left min-w-[500px]">
                        <thead>
                            <tr
                                class="bg-slate-50/50 border-b border-slate-100 text-[10px] font-black text-slate-400 uppercase tracking-widest">
                                <th class="p-4 md:p-5">Registry Identity</th>
                                <th class="p-4 md:p-5">Classification</th>
                                <th class="p-4 md:p-5 text-right">Access Control</th>
                            </tr>
                        </thead>
                        <tbody id="registry-body" class="divide-y divide-slate-100">
                            <!-- Mock Data Row 1 -->
                            <tr class="hover:bg-slate-50/50 transition-colors list-row"
                                data-search="john doe john.doe@example.com">
                                <td class="p-4 md:p-5">
                                    <div class="flex items-center gap-3 md:gap-4">
                                        <div
                                            class="w-10 h-10 md:w-12 md:h-12 rounded-xl md:rounded-2xl bg-blue-100 border border-blue-200 flex items-center justify-center text-blue-600 text-[10px] md:text-xs font-black shrink-0">
                                            JD
                                        </div>
                                        <div class="flex flex-col">
                                            <span class="text-sm font-black text-[#0a192f] line-clamp-1">John Doe</span>
                                            <span
                                                class="text-[9px] md:text-[10px] text-slate-400 font-bold uppercase tracking-widest mt-0.5">john.doe@example.com</span>
                                        </div>
                                    </div>
                                </td>
                                <td class="p-4 md:p-5">
                                    <span
                                        class="px-2 py-1 bg-white border border-slate-100 rounded-lg text-[8px] md:text-[9px] font-black uppercase tracking-widest text-slate-500 whitespace-nowrap">
                                        ATHLETE
                                    </span>
                                </td>
                                <td class="p-4 md:p-5 text-right">
                                    <a href="#"
                                        class="inline-flex items-center justify-center px-4 md:px-6 py-2 md:py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-[9px] md:text-[10px] font-black uppercase tracking-widest transition-all shadow-lg shadow-blue-500/30 active:scale-95 whitespace-nowrap">View</a>
                                </td>
                            </tr>
                            <!-- Mock Data Row 2 -->
                            <tr class="hover:bg-slate-50/50 transition-colors list-row"
                                data-search="sarah smith sarah.s@gmail.com">
                                <td class="p-4 md:p-5">
                                    <div class="flex items-center gap-3 md:gap-4">
                                        <div
                                            class="w-10 h-10 md:w-12 md:h-12 rounded-xl md:rounded-2xl bg-purple-100 border border-purple-200 flex items-center justify-center text-purple-600 text-[10px] md:text-xs font-black shrink-0">
                                            SS
                                        </div>
                                        <div class="flex flex-col">
                                            <span class="text-sm font-black text-[#0a192f] line-clamp-1">Sarah Smith</span>
                                            <span
                                                class="text-[9px] md:text-[10px] text-slate-400 font-bold uppercase tracking-widest mt-0.5">sarah.s@gmail.com</span>
                                        </div>
                                    </div>
                                </td>
                                <td class="p-4 md:p-5">
                                    <span
                                        class="px-2 py-1 bg-white border border-slate-100 rounded-lg text-[8px] md:text-[9px] font-black uppercase tracking-widest text-slate-500 whitespace-nowrap">
                                        SPECIAL ATHLETE
                                    </span>
                                </td>
                                <td class="p-4 md:p-5 text-right">
                                    <a href="#"
                                        class="inline-flex items-center justify-center px-4 md:px-6 py-2 md:py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-[9px] md:text-[10px] font-black uppercase tracking-widest transition-all shadow-lg shadow-blue-500/30 active:scale-95 whitespace-nowrap">View</a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script>
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const backdrop = document.getElementById('sidebar-backdrop');
            
            if (sidebar.classList.contains('sidebar-hidden')) {
                sidebar.classList.remove('sidebar-hidden');
                sidebar.classList.add('sidebar-visible');
                backdrop.classList.remove('hidden');
            } else {
                sidebar.classList.remove('sidebar-visible');
                sidebar.classList.add('sidebar-hidden');
                backdrop.classList.add('hidden');
            }
        }

        document.getElementById('saSearch').addEventListener('input', function (e) {
            var q = e.target.value.toLowerCase().trim();
            document.querySelectorAll('.list-row').forEach(function (row) {
                var txt = row.getAttribute('data-search') || '';
                row.style.display = (txt.indexOf(q) !== -1) ? '' : 'none';
            });
        });

        // Handle window resize to fix sidebar state
        window.addEventListener('resize', () => {
            if (window.innerWidth >= 768) {
                document.getElementById('sidebar').classList.add('md:sidebar-visible');
                document.getElementById('sidebar').classList.remove('sidebar-hidden');
                document.getElementById('sidebar-backdrop').classList.add('hidden');
            } else {
                if (!document.getElementById('sidebar').classList.contains('sidebar-visible')) {
                    document.getElementById('sidebar').classList.add('sidebar-hidden');
                }
            }
        });
    </script>
</body>

</html>
